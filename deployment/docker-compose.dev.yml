
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ../backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    command: php artisan horizon
    volumes:
      - ../backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    command: php artisan schedule:work
    volumes:
      - ../backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: devsecops-agent
    restart: unless-stopped
    init: true

    env_file:
      - ../agent/.env

    environment:
      DEVSECOPS_API_URL: http://api:8000
      DOCKER_HOST: unix:///var/run/docker.sock
      TZ: Asia/Jakarta

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      api:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devsecops
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: dev_password_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devsecops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops -d devsecops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - devsecops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devsecops_postgres_data:
  devsecops_redis_data:
  backend_vendor:
